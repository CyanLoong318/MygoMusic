# MygoMusic 配置文件

# 数据库配置
database:
  type: sqlite  # sqlite / mysql
  mysql:
    host: localhost
    port: 3306
    database: mygomusic
    username: root
    password: ""
    pool-size: 10

# 音源配置
sources:
  netease:
    enabled: true
    base-url: "https://music.163.com"
  kugou:
    enabled: true
    base-url: "https://www.kugou.com"
  bilibili:
    enabled: true
    base-url: "https://www.bilibili.com"
    # 播放方式:
    #   direct    = 直接解析出B站CDN音频直链下发给客户端，由客户端自行拉流播放（推荐）
    #               无需 ffmpeg、不占用服务器带宽、外地玩家也不受服务器公网地址影响；
    #               需要客户端为配套的新版 (v1.0.2+) 才能解码 B站的 m4s(AAC) 音频。
    #   transcode = 旧方案：服务端下载 + ffmpeg 转码为 MP3，再用内置 HTTP 服务分发给客户端
    #               （客户端版本较旧时的兼容选项）
    play-mode: direct
    # 服务端下载B站音频/视频临时文件的整体超时(秒)：超时按取歌失败处理并清理临时文件
    # 仅 transcode 模式与 direct 的回退路径（无 AAC-LC 音轨的视频）使用；0 或负数 = 不限
    download-timeout-seconds: 300

# 队列配置
queue:
  max-size: 50           # 队列最大长度
  cooldown-seconds: 10   # 点歌冷却时间(秒)
  auto-play: true        # 当前播放完毕后自动播放下一首
  history-size: 100      # 保存的历史播放记录数量(用于"上一首"功能)
  save-on-shutdown: true # 关服时保存队列到文件
  # 单首歌「取详情/解析播放URL」的看门狗超时(秒)：超时则跳过该歌并自动播下一首，
  # 防止一个卡住的音源把整个队列拖死（直链模式与网易云/酷狗等解析URL应秒级完成）。
  # 0 或负数 = 关闭看门狗
  fetch-timeout-seconds: 60
  # 仅「服务端下载 + 转码」的取歌使用（B站 play-mode=transcode，或 direct 下回退转码的视频）。
  # 必须大于 download-timeout-seconds + ffmpeg.timeout-seconds，否则可能误杀正常的长转码。
  # 0 或负数 = 关闭看门狗
  transcode-fetch-timeout-seconds: 900

# 说明：音量与歌词显示都是「客户端本地设置」，服务端无法代管
# （音频在玩家客户端播放），因此这里不再提供 default-volume / lyrics.* 之类的开关，
# 免得填了却不生效。玩家用 /mm volume 与 /mm lyrics 调整自己的设置。

# 客户端音频缓存设置（由服务端统一下发，客户端GUI不再提供该设置）
client-cache:
  enabled: true          # 是否允许客户端缓存音频文件
  max-size-mb: 512       # 客户端缓存目录上限 (MB)

# HTTP 文件服务器（用于向客户端分发 B站转码后的 MP3）
# host: 对外可达的地址/域名，拼进玩家客户端下载 MP3 的 URL。
#   留空(默认) 时自动检测本机公网 IPv6 —— 服务器没有公网 IPv4 时，外地玩家只能通过 IPv6 下载音频。
#   也可手动指定：公网 IPv6 "2408:xxxx::1"、DDNS 域名 "mc.example.com"、或仅内网时填局域网 IPv4。
http-server:
  port: 8080         # HTTP 端口；需在系统防火墙放行该端口的入站(IPv6)连接
  host: ""           # 留空自动检测公网 IPv6

# FFmpeg 配置 (用于B站视频转码)
ffmpeg:
  path: "ffmpeg"         # ffmpeg 可执行文件路径
  cache-dir: "plugins/MygoMusic/cache/bilibili"  # B站转码缓存目录
  cache-max-size: 1024   # 缓存最大大小 (MB)
  timeout-seconds: 300   # 单次转码超时 (秒)：超时强制结束 ffmpeg 进程并判失败；慢CPU/长视频可调大

# 权限配置
permissions:
  cooldown-bypass: "mygomusic.nocooldown"  # 免冷却权限（/mm play、/mm select、/mm playid 通用）
